            <script>
            const changeImageButton = document.getElementById('changeImageButton');
            const imageInput = document.getElementById('imageInput');
            const displayImage = document.getElementById('displayImage');

            changeImageButton.addEventListener('click', function () {
            imageInput.click();
            });

            imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    displayImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
            });
            </script>

        <!--一次性可全部保存的姓名班级和学号-->
        <div class="r">
            <div class="field">
                <label for="name">姓名:</label>
                <span id="name-display">邓琴</span>
                <input type="text" id="name-input">
            </div>
            <div class="field">
                <label for="gender">性别:</label>
                <span id="gender-display">女</span>
                <input type="text" id="gender-input">
            </div>
            <div class="field">
                <label for="class">班级:</label>
                <span id="class-display">23级计科六班</span>
                <input type="text" id="class-input">
            </div>
            <button onclick="enableEdit()">编辑</button>
            <button id="save-button" style="display: none;" onclick="saveAll()">保存</button>
            <script>
                function enableEdit() {
                    const fields = ['name', 'gender', 'class'];
                    fields.forEach(field => {
                        const display = document.getElementById(`${field}-display`);
                        const input = document.getElementById(`${field}-input`);
                        input.value = display.textContent;
                        display.style.display = 'none';
                        input.style.display = 'inline-block';
                    });
                    document.querySelector('button:first-of-type').style.display = 'none';
                    document.getElementById('save-button').style.display = 'inline-block';
                }
        
                function saveAll() {
                    const fields = ['name', 'gender', 'class'];
                    fields.forEach(field => {
                        const display = document.getElementById(`${field}-display`);
                        const input = document.getElementById(`${field}-input`);
                        display.textContent = input.value;
                        display.style.display = 'inline-block';
                        input.style.display = 'none';
                    });
                    document.querySelector('button:first-of-type').style.display = 'inline-block';
                    document.getElementById('save-button').style.display = 'none';
                    alert('保存成功！');
                }
            </script>

        <!--个人简介-->
        <div class="introduce-tit">
            个人简历
          </div>
          <div class="edu-box">
                <img src="./img/hat.png" width="100">
                <div class="z">
                    以下为本人的简介（含毕业/就读院校、个人技能、实习经历等）
                </div>

                <div id="editor" class="editor" contenteditable="true">
                    本人就读于湖南科技大学，是计算机院校的一名学生……
                </div>
                <button id="saveButton">保存</button>
                <script>
                    const editor = document.getElementById('editor');
                    const saveButton = document.getElementById('saveButton');
            
                    saveButton.addEventListener('click', function () {
                        const content = editor.innerHTML;
                        // 这里可以将 content 保存到本地存储
                        localStorage.setItem('articleContent', content);
                        alert('文章已保存！');
                    });
            
                    // 页面加载时尝试从本地存储恢复内容
                    const savedContent = localStorage.getItem('articleContent');
                    if (savedContent) {
                        editor.innerHTML = savedContent;
                    }
                </script>
